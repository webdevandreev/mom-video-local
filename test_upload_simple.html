<!DOCTYPE html>
<html>
<head>
    <title>Тест загрузки видео</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #8a2be2; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #7a1bd2; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🧪 Тест загрузки видео</h1>
    
    <div class="form-group">
        <label for="videoFile">📁 Выберите видео файл:</label>
        <input type="file" id="videoFile" accept="video/*">
    </div>
    
    <div class="form-group">
        <label for="title">📝 Заголовок:</label>
        <input type="text" id="title" value="Тестовое видео">
    </div>
    
    <div class="form-group">
        <label for="description">📄 Описание:</label>
        <textarea id="description" rows="3">Это тестовое видео для проверки загрузки</textarea>
    </div>
    
    <div class="form-group">
        <label for="category">🏷️ Категория:</label>
        <select id="category">
            <option value="beading">Бисероплетение</option>
            <option value="embroidery">Вышивка</option>
            <option value="other">Другое</option>
        </select>
    </div>
    
    <button onclick="uploadTest()">🚀 Начать тест загрузки</button>
    
    <div id="result"></div>
    
    <script>
    function uploadTest() {
        const fileInput = document.getElementById('videoFile');
        const resultDiv = document.getElementById('result');
        
        if (!fileInput.files.length) {
            resultDiv.innerHTML = '<div class="error">❌ Выберите файл для загрузки</div>';
            return;
        }
        
        const file = fileInput.files[0];
        console.log('📁 Выбран файл:', file.name, 'размер:', file.size, 'тип:', file.type);
        
        const formData = new FormData();
        formData.append('video', file);
        formData.append('title', document.getElementById('title').value);
        formData.append('description', document.getElementById('description').value);
        formData.append('category', document.getElementById('category').value);
        
        resultDiv.innerHTML = '<div>⏳ Загружаем файл... Пожалуйста, подождите.</div>';
        
        // Показываем прогресс
        const xhr = new XMLHttpRequest();
        
        xhr.upload.addEventListener('progress', function(e) {
            if (e.lengthComputable) {
                const percentComplete = (e.loaded / e.total) * 100;
                resultDiv.innerHTML = `<div>⏳ Загрузка: ${percentComplete.toFixed(1)}%</div>`;
            }
        });
        
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                resultDiv.innerHTML = `<div>✅ Получен ответ от сервера</div>`;
                
                try {
                    const response = JSON.parse(xhr.responseText);
                    console.log('📨 Ответ сервера:', response);
                    
                    if (response.success) {
                        resultDiv.innerHTML = `
                            <div class="success">
                                <h3>✅ Видео успешно загружено!</h3>
                                <p><strong>Файл:</strong> ${response.filename}</p>
                                <p><strong>Путь:</strong> ${response.filepath}</p>
                                <p><strong>Размер:</strong> ${response.filesize}</p>
                                <p><strong>Тип:</strong> ${response.filetype}</p>
                                <button onclick="checkVideos()">Проверить список видео</button>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="error">
                                <h3>❌ Ошибка загрузки</h3>
                                <p><strong>Сообщение:</strong> ${response.error}</p>
                                ${response.details ? `<p><strong>Детали:</strong> ${response.details}</p>` : ''}
                                ${response.error_code ? `<p><strong>Код ошибки:</strong> ${response.error_code}</p>` : ''}
                                <pre>${JSON.stringify(response, null, 2)}</pre>
                            </div>
                        `;
                    }
                } catch (e) {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Ошибка парсинга ответа</h3>
                            <p>Ответ сервера не в JSON формате</p>
                            <pre>${xhr.responseText}</pre>
                        </div>
                    `;
                }
            }
        };
        
        xhr.onerror = function() {
            resultDiv.innerHTML = '<div class="error">❌ Сетевая ошибка при отправке запроса</div>';
        };
        
        xhr.open('POST', '/api/upload_video.php');
        xhr.send(formData);
    }
    
    function checkVideos() {
        fetch('/api/get_videos.php')
            .then(r => r.json())
            .then(data => {
                alert(`📹 Всего видео: ${data.length}\n\n${JSON.stringify(data, null, 2)}`);
            })
            .catch(err => {
                alert('Ошибка при получении списка видео: ' + err.message);
            });
    }
    </script>
</body>
</html>
